name: Open-Source Repository APK Builder

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository name from repos.toml or full GitHub URL to build"
        required: false
        default: ""
      branch:
        description: "Branch or Tag to checkout"
        required: false
        default: "main"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Open-Source Repos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Android Environment
        uses: ./.github/actions/setup-android-env
        with:
          java-version: "21"

      - name: Setup Patcher Tools & Signer
        uses: ./.github/actions/setup-patcher-tools

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Prepare Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > bin/keystores/ks.keystore
          fi

      - name: Build Repositories
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          if [ -n "$TARGET_REPO" ]; then
            python -m src.cli build --repo "$TARGET_REPO"
          else
            python -m src.cli build
          fi

      - name: Generate Release Tag
        id: release_info
        run: |
          TAG="oss-build-$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Generate Storage Hub & Index
        run: |
          python -m src.cli storage --tag "${{ steps.release_info.outputs.RELEASE_TAG }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_info.outputs.RELEASE_TAG }}
        run: |
          if [ -d "dist/apks" ] && [ "$(ls -A dist/apks)" ]; then
            gh release create "$RELEASE_TAG" dist/apks/* \
              --title "RPDevs Open-Source Build $RELEASE_TAG" \
              --notes "Compiled from open-source repositories on $(date -u)."
          fi

      - name: Upload Storage Artifacts for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
