name: ReVanced & Morphe Patch Pipeline

on:
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      target_app:
        description: "Target application to patch (leave empty for all enabled apps)"
        required: false
        default: ""
      force_version:
        description: "Override version string (e.g. 19.16.39)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  patch:
    name: Patch & Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Android Environment
        uses: ./.github/actions/setup-android-env
        with:
          java-version: "21"

      - name: Setup Patcher Tools
        uses: ./.github/actions/setup-patcher-tools

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Prepare Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > bin/keystores/ks.keystore
          fi

      - name: Execute Patch Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'pass:123456789' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'jhc' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'pass:123456789' }}
          TARGET_APP: ${{ inputs.target_app }}
        run: |
          if [ -n "$TARGET_APP" ]; then
            python -m src.cli patch --app "$TARGET_APP"
          else
            python -m src.cli patch
          fi

      - name: Generate Release Tag & Version
        id: release_info
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Generate Storage Hub & Indexes
        run: |
          python -m src.cli storage --tag "${{ steps.release_info.outputs.RELEASE_TAG }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_info.outputs.RELEASE_TAG }}
        run: |
          if [ -d "dist/apks" ] && [ "$(ls -A dist/apks)" ]; then
            gh release create "$RELEASE_TAG" dist/apks/* \
              --title "RPDevs APK Vault Release $RELEASE_TAG" \
              --notes "Automated build and patch release generated on $(date -u)."
          fi

      - name: Upload Storage Artifacts for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Broadcast Notifications (Telegram / Discord)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Notifications dispatched if webhooks configured."
