[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-build-patch"
version = "1.0.0"
description = "Universal Android CI/CD Pipeline, ReVanced/Morphe Patcher Engine, Open-Source Repo Builder & Ultimate APK Storage Hub"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "RPDevs-Builds Team", email = "dev@rpdevs.org" }
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "rich>=13.7.0",
    "tomli-w>=1.0.0",
    "jinja2>=3.1.3",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.2.0"
]

[project.optional-dependencies]
playstore = ["gplaycli>=3.4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0"
]

[project.scripts]
apk-engine = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
